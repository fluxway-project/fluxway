[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxway"
version = "0.1.0"
description = "Fluxway: A Flexible Large-scale Unified eXchange for maximizing Workload Accelerated Yield across heterogeneous compute clusters"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Fluxway Contributors"}
]
keywords = [
    "distributed",
    "deep-learning",
    "spmd",
    "asynchronous",
    "graph-orchestration"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic",
    "uvloop",
    "numpy>=1.22,<2.5",
    "ml_dtypes>=0.4.0",
    "ray>=2.59.0",
    "ortools>=9.12",
    "numba>=0.66.0",
    "tbb",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
torch = [
    "torch>=2.00.0",
    "safetensors",
]
jax = [
    "jax>=0.12.0",
    "orbax-checkpoint>=0.12.7",
    "grain",
]
cuda12x = [
    "cupy-cuda12x>=13.0.0",
]
cuda13x = [
    "cupy-cuda13x>=13.0.0",
]
profiler = [
    "perfetto",
]
visualization = [
    "ai-edge-model-explorer>=0.1.34",
]
recommendation = [
    "sparse_embedding[pylance]>=0.1.0",
]


[project.urls]
Homepage = "https://github.com/fluxway-project/fluxway"
Documentation = "https://github.com/fluxway-project/fluxway#readme"
Repository = "https://github.com/fluxway-project/fluxway"

[dependency-groups]
lint = ["ruff==0.16.0"]
build = ["build>=1.2.2", "twine>=6.1", "packaging>=24.2"]
test-tools = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "pyyaml>=6.0"]
test = [{include-group = "test-tools"}, "flax", "safetensors"]

[tool.setuptools.packages.find]
include = ["fluxway*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
fluxway = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
include = ["*.py", "*.pyi", "*.ipynb", "**/pyproject.toml"]
extend-exclude = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["I", "B", "Q", "C4", "W", "UP"]
ignore = [
    "B003",
    "B005",
    "B007",
    "B008",
    "B011",
    "B012",
    "B015",
    "B017",
    "B028",
    "C408",
    "C417",
    "E741",
    # Below are auto-fixable rules
    "I001",
]

[tool.ruff.lint.flake8-quotes]
avoid-escape = false

[tool.ruff.lint.isort]
combine-as-imports = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder", "afterray"]
known-local-folder = ["fluxway"]
known-third-party = []

[tool.ruff.lint.isort.sections]
afterray = ["psutil", "setproctitle"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"doc/*" = ["I"]
"fluxway/__init__.py" = ["I"]
"release/*_tests/*.py" = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pyrefly]
ignore-missing-imports = [
    "cupy",
    "flax",
    "grain",
    "grain.python",
    "jax",
    "jax.numpy",
    "jax.sharding",
    "jax.tree_util",
    "ml_dtypes",
    "numba",
    "numpy",
    "orbax",
    "orbax.checkpoint",
    "pydantic",
    "pytest",
    "ray",
    "safetensors",
    "safetensors.numpy",
    "setuptools",
    "torch.utils.dlpack",
    "perfetto.protos.perfetto.trace",
]

[tool.pyright]
exclude = [
    "benchmarks",
]
