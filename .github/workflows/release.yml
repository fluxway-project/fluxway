name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group build
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Match tag to project version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/distribution.py release "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  pypi:
    name: Publish to PyPI
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/fluxway
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-distributions
          path: dist
      - name: Publish verified distributions with OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086

  github-release:
    name: Create GitHub Release
    needs: [validate, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-distributions
          path: dist
      - name: Attach the published distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          args=(release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG")
          if [ "$RELEASE_PRERELEASE" = true ]; then
            args+=(--prerelease --latest=false)
          fi
          gh "${args[@]}"
