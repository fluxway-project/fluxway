name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group lint
      - run: bash scripts/format.sh --check

  tests:
    name: CPU tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '2'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[jax,profiler,visualization]' --group test --group build
      - run: python -m pip check
      - name: Run portable CPU suite
        run: >-
          python -m pytest -ra --strict-markers --strict-config
          --ignore=tests/checkpointer/test_retention.py
          --ignore=tests/example/test_sparse_checkpoint_e2e.py
          --junitxml=tmp/test-results.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-results-${{ matrix.python-version }}
          path: tmp/test-results.xml
          if-no-files-found: warn

  distributions:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group build --group test-tools
      - name: Test distribution validation
        run: python -m pytest --confcutdir=tests/packaging tests/packaging
      - name: Build sdist and build wheel from sdist
        run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/distribution.py check dist
      - name: Install wheel with only core dependencies
        run: |
          python -m venv tmp/wheel-env
          tmp/wheel-env/bin/python -m pip install dist/*.whl
          tmp/wheel-env/bin/python -m pip check
          tmp/wheel-env/bin/python -I scripts/check_installed.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
